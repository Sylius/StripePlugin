flux_se_sylius_stripe_plugin:
    admin:
        notification:
            legacy_secret_key: 'La méthode de paiement « %payment_method_name% » utilise une clé secrète legacy (sk_…). Passez à une clé d''API restreinte depuis l''application Sylius Stripe.'
        payment_method:
            index:
                legacy_key_alert: 'La méthode de paiement « <u>%payment_method_name%</u> » utilise une clé secrète legacy (sk_…). Passez à une clé d''API restreinte depuis l''application Sylius Stripe pour garantir la continuité du service.'
                legacy_key_alert_button: 'Mettre à jour la clé'
                legacy_key_requires_action: 'Action requise'
                suggested:
                    label: 'Suggéré'
                    description: 'Connectez votre boutique à Stripe et commencez à accepter les cartes, portefeuilles et moyens de paiement locaux en quelques minutes.'
                    configure: 'Configurer'
                    stripe_checkout: 'Stripe Checkout'
                    stripe_web_element: 'Stripe Web Elements'
    gateway_factory:
        stripe_checkout: Stripe (Checkout)
        stripe_web_elements: Stripe (Web Elements)
    form:
        gateway_configuration:
            stripe:
                publishable_key: Clé publique
                secret_key: Clé d'API restreinte
                use_authorize: Utiliser "authorize"
                enable_express_checkout: Activer Express Checkout
                enable_adaptive_pricing: Activer la tarification adaptative
                webhook_secret_keys: Clés secrètes du webhook
                info:
                    secret_key: Collez les deux clés depuis la page de paramètres de votre application Sylius Stripe - la clé publique (pk_…) et la clé d'API restreinte (rk_…).
                    secret_key_legacy_warning: Cette passerelle utilise encore une clé secrète Stripe standard (sk_…), qui n'est plus prise en charge en 2.0. L'enregistrement de ce formulaire sera rejeté par le validateur - remplacez la clé par une clé d'API restreinte depuis l'application Sylius Stripe.
                    use_authorize:  Lorsqu'un paiement est autorisé, la banque garantit le montant et le conserve sur la carte du client jusqu'à sept jours.
                    enable_express_checkout: Affichez les boutons de portefeuille sur les pages du panier et du paiement. Les boutons réellement affichés dépendent des portefeuilles activés dans votre tableau de bord Stripe et du navigateur du client. Nécessite des événements webhook et un domaine de méthode de paiement enregistré.
                    enable_adaptive_pricing: Affichez les prix de paiement dans la devise locale du client tout en continuant à encaisser dans votre propre devise. Stripe applique un écart de change sur les montants convertis à partir de 2 %, et les remboursements restent dans votre devise de règlement. Remplace le réglage Adaptive Pricing du tableau de bord uniquement pour cette passerelle. Examinez l'ensemble des coûts avant d'activer cette option.
                    webhook_secret_key: Créez un nouveau webhook endpoint pour créer une clé secrète de webhook sur le tableau de bord Stripe et écoutez plusieurs événements.
                action:
                    view_stripe_app: Voir l'application Sylius Stripe
                    or: ou
                    install_stripe_app: installez-la directement
                    learn_more_restricted_keys: En savoir plus sur les clés d'API restreintes
                    replace_key_badge: Remplacez la clé par une clé d'API restreinte
                    webhook_secret_key: Créez un nouveau webhook endpoint
    stripe_appearance:
        title: Apparence du formulaire de paiement
        commonly_used_variables: Variables couramment utilisées
        variables_table:
            variable: Variable
            description: Description
            font_family: 'La famille de police utilisée dans toute l''interface. Elements supporte les polices personnalisées en passant l''option <span class="text-primary">fonts</span> à <a href="https://docs.stripe.com/js/custom_checkout/init#custom_checkout_init-options-elementsOptions-fonts" target="_blank" rel="noopener noreferrer" class="fw-bold stripe-docs-link">initCheckoutElementsSdk</a> ou <a href="https://docs.stripe.com/js/react_stripe_js/checkout/checkout_provider#react_checkout_provider-options-elementsOptions-fonts" target="_blank" rel="noopener noreferrer" class="fw-bold stripe-docs-link">CheckoutElementsProvider</a>.'
            font_size_base: 'La taille de police définie à la racine de l''interface. Les autres tailles (<span class="text-primary">fontSizeXs</span>, <span class="text-primary">fontSizeSm</span>, etc.) sont calculées à partir de cette valeur en unités <span class="text-primary">rem</span>. Utilisez au moins 16px pour les champs de saisie sur mobile.'
            spacing_unit: L'unité d'espacement de base dont dérive tout autre espacement. Augmentez ou diminuez cette valeur pour rendre votre mise en page plus ou moins aérée.
            border_radius: Le rayon de bordure utilisé pour les onglets, les champs et les autres composants.
            color_primary: Une couleur principale utilisée dans toute l'interface. Définissez-la comme couleur principale de votre marque.
            color_background: La couleur utilisée pour l'arrière-plan des champs, onglets et autres composants.
            color_text: La couleur de texte par défaut utilisée.
            color_danger: Une couleur utilisée pour indiquer les erreurs ou les actions destructives.
        info:
            core_variables: 'Ce sont les variables principales disponibles par défaut. Pour une personnalisation supplémentaire, consultez « Personnaliser l''apparence des éléments pour correspondre au design de votre site » dans la documentation.'
            open_stripe_docs: Ouvrir la documentation Stripe
        theme: Thème
        inputs: Style des champs
        labels: Position des libellés
        color_primary: Couleur principale (hex)
        color_background: Couleur de fond (hex)
        color_text: Couleur du texte (hex)
        color_danger: Couleur d'erreur (hex)
        font_family: Police de caractères
        border_radius: Rayon des coins
        spacing_unit: Unité d'espacement
        theme_choices:
            stripe: Stripe (défaut)
            night: Nuit
            flat: Plat
        inputs_choices:
            spaced: Espacé (défaut)
            condensed: Condensé
        labels_choices:
            auto: Auto (défaut)
            above: Au-dessus
            floating: Flottant
    order_pay:
        web_elements:
            pay: Payer
