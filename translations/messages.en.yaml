flux_se_sylius_stripe_plugin:
    admin:
        notification:
            legacy_secret_key: 'Payment method "%payment_method_name%" uses a legacy secret key (sk_…). Switch to a Restricted API Key from the Sylius Stripe App.'
        payment_method:
            index:
                legacy_key_alert: 'Payment method "%payment_method_name%" uses a legacy secret key (sk_…). Switch to a Restricted API Key from the Sylius Stripe App to ensure uninterrupted service.'
                legacy_key_alert_button: 'Update Key'
                legacy_key_requires_action: 'Requires Action'
                suggested:
                    label: 'Suggested'
                    description: 'Connect your store to Stripe and start accepting cards, wallets and local payment methods in minutes.'
                    configure: 'Configure'
                    stripe_checkout: 'Stripe Checkout'
                    stripe_web_element: 'Stripe Web Elements'
    gateway_factory:
        stripe_checkout: Stripe (Checkout)
        stripe_web_elements: Stripe (Web Elements)
    form:
        gateway_configuration:
            stripe:
                publishable_key: Publishable key
                secret_key: Restricted API key
                use_authorize: Use authorize
                enable_express_checkout: Enable Express Checkout
                enable_adaptive_pricing: Enable Adaptive Pricing
                webhook_secret_keys: Webhook secret keys
                info:
                    secret_key: Paste both keys from your Sylius Stripe App Settings Page - the publishable key (pk_…) and the Restricted API Key (rk_…).
                    secret_key_legacy_warning: This gateway still uses a standard Stripe secret key (sk_…), which is no longer supported in 2.0. Saving this form will be rejected by the validator - replace the key with a Restricted API Key from the Sylius Stripe App.
                    use_authorize: When a payment is authorized, the bank guarantees the amount and holds it on the customer’s card for up to seven days.
                    enable_express_checkout: Show wallet buttons on cart and checkout pages. The actual buttons rendered are decided by the wallets enabled in your Stripe Dashboard and by the customer's browser. Requires webhook events and a registered payment method domain.
                    enable_adaptive_pricing: Display checkout prices in the customer's local currency while you continue to settle in your own currency. Stripe applies an FX spread on converted amounts starting at 2%, and refunds remain in your settlement currency. Overrides the dashboard-wide Adaptive Pricing setting for this gateway only. Review the full pricing breakdown before enabling.
                    webhook_secret_key: Create a new webhook endpoint to generate a new webhook secret key on the Stripe dashboard and listen for several events.
                action:
                    view_stripe_app: View the Sylius Stripe App
                    or: or
                    install_stripe_app: install it directly
                    learn_more_restricted_keys: Learn more about restricted API keys
                    replace_key_badge: Replace the key with a Restricted API Key
                    webhook_secret_key: Create a new webhook endpoint
    stripe_appearance:
        title: Payment form appearance
        commonly_used_variables: Commonly used variables
        variables_table:
            variable: Variable
            description: Description
            font_family: 'The font family used throughout the UI. Elements support custom fonts by passing the <span class="text-primary">fonts</span> option to <a href="https://docs.stripe.com/js/custom_checkout/init#custom_checkout_init-options-elementsOptions-fonts" target="_blank" rel="noopener noreferrer" class="fw-bold stripe-docs-link">initCheckoutElementsSdk</a> or <a href="https://docs.stripe.com/js/react_stripe_js/checkout/checkout_provider#react_checkout_provider-options-elementsOptions-fonts" target="_blank" rel="noopener noreferrer" class="fw-bold stripe-docs-link">CheckoutElementsProvider</a>.'
            font_size_base: 'The font size that''s set on the root of the UI. By default, other font size variables such as <span class="text-primary">fontSizeXs</span> or <span class="text-primary">fontSizeSm</span> are scaled from this value using <span class="text-primary">rem</span> units. Make sure that you choose a font size of at least 16px for input fields on mobile.'
            spacing_unit: The base spacing unit that all other spacing is derived from. Increase or decrease this value to make your layout more or less spacious.
            border_radius: The border radius used for tabs, inputs, and other components.
            color_primary: A primary color used throughout the UI. Set this to your primary brand color.
            color_background: The color used for the background of inputs, tabs, and other components.
            color_text: The default text color used.
            color_danger: A color used to indicate errors or destructive actions.
        info:
            core_variables: 'These are the core variables available by default. For additional customization, see "Customize the look and feel of Elements to match the design of your site" in the documentation.'
            open_stripe_docs: Open Stripe Docs
        theme: Theme
        inputs: Input style
        labels: Label position
        color_primary: Primary color (hex)
        color_background: Background color (hex)
        color_text: Text color (hex)
        color_danger: Error color (hex)
        font_family: Font family
        border_radius: Border radius
        spacing_unit: Spacing unit
        theme_choices:
            stripe: Stripe (default)
            night: Night
            flat: Flat
        inputs_choices:
            spaced: Spaced (default)
            condensed: Condensed
        labels_choices:
            auto: Auto (default)
            above: Above
            floating: Floating
    order_pay:
        web_elements:
            pay: Pay
